name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra api

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
