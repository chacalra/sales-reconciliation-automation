[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-reconciliation-automation"
version = "0.1.0"
description = "Consolidate, validate and reconcile sales exports into reliable Excel reports."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "openpyxl>=3.1,<4", "requests>=2.32,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
api = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
sales-automation = "sales_automation.main:main"

[tool.setuptools.packages.find]
include = ["sales_automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
